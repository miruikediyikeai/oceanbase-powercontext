# Only this application's adapter endpoint is allowed from Dify HTTP nodes.
http_port 3128
acl cabinet dstdomain adapter
acl cabinet_port port 8812
http_access allow cabinet cabinet_port
http_access deny all
cache deny all
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename /tmp/squid.pid
shutdown_lifetime 1 seconds
